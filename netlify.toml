[build]
  publish = "."

# Die Verbindungsliste der CSP nennt die Gegenstellen, mit denen diese Seite
# reden darf. Sie bleibt eine AUFZAEHLUNG — nicht "https:" —, damit ein
# eingeschleustes Skript nichts an eine beliebige Adresse schicken kann.
#
# Dazu gehoert seit der Vorbelegung der Verwaltung auch die Website der
# Kundschaft: Der Kundenlink liest von dort `inhalt.json`, um zu zeigen, was
# HEUTE auf dieser Website steht. Fehlt der Eintrag, weist der BROWSER die
# Abfrage ab — die Verwaltung stand dann leer da, obwohl die Website die Datei
# ordentlich freigegeben hatte. Genau dieser Fall ist eingetreten.
#
# WICHTIG: Jede weitere Kundenwebsite, deren Verwaltung vorbelegt werden soll,
# muss hier ebenfalls eingetragen werden.
[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-src 'self' https:; connect-src 'self' https://management-xo2-pro.netlify.app https://jupidu-36804-default-rtdb.europe-west1.firebasedatabase.app https://beispiel-lehner.netlify.app; form-action 'self' mailto:; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Kundenseiten sind personalisierte Bearer-Links: nie zwischenspeichern und
# ausdruecklich nicht indexieren.
[[headers]]
  for = "/kunde.html"

  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Der Fragebogen haengt an einem Einladungstoken — dieselbe Regel.
[[headers]]
  for = "/fragebogen.html"

  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
